name: OpenMeteoDemo
options:
  bundleIdPrefix: io.github.halilozel1903
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
packages:
  OpenMeteoKit:
    path: ..
targets:
  BreezeWatch:
    # A standalone (watch-only) app: one application target built with the watchOS SDK, no iOS companion.
    type: application
    platform: watchOS
    sources:
      - Shared
      - Watch
    dependencies:
      - package: OpenMeteoKit
        product: OpenMeteoKit
      - package: OpenMeteoKit
        product: OpenMeteoUI
    info:
      path: BreezeWatch-Info.plist
      properties:
        CFBundleDisplayName: Breeze
        WKApplication: true
        WKWatchOnly: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.halilozel1903.BreezeWatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Breeze
        INFOPLIST_KEY_WKWatchOnly: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "4"
  BreezePhone:
    type: application
    platform: iOS
    sources:
      - Shared
      - Phone
    dependencies:
      - package: OpenMeteoKit
        product: OpenMeteoKit
      - package: OpenMeteoKit
        product: OpenMeteoUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.halilozel1903.BreezePhone
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Breeze
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  BreezeWatch:
    build:
      targets:
        BreezeWatch: all
    run:
      config: Debug
  BreezePhone:
    build:
      targets:
        BreezePhone: all
    run:
      config: Debug
